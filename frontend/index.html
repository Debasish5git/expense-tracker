<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
</head>

<body>
    <header>
        <h1>Expense Tracker</h1>
    </header>

    <aside>
        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Expenses</a>
            <a href="#">Income</a>
            <a href="#">Budget</a>
            <a href="#">Reports</a>
        </nav>
    </aside>

    <main>
        <h2>Dashboard</h2>

        <section>
            <h3>Total Income</h3>
            <p>₹0</p>
        </section>

        <section>
            <h3>Total Expenses</h3>
            <p>₹0</p>
        </section>

        <section>
            <h3>Balance</h3>
            <p>₹0</p>
        </section>

    <section>
        <h2>Recent Transactions</h2>
        <table>
            <thread>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Amount</th>
                </tr>
            </thread>

            <tbody>
                <tr>
                    <td>18 Aug 2026</td>
                    <td>Lunch</td>
                    <td>Food</td>
                    <td>₹250</td>
                </tr>

                <tr>
                    <td>17 Aug 2026</td>
                    <td>Bus</td>
                    <td>Transport</td>
                    <td>₹50</td>
                </tr>

                <tr>
                    <td>16 Aug 2026</td>
                    <td>Movie</td>
                    <td>Entertainment</td>
                    <td>₹300</td>
                </tr>
            </tbody>

        </table>
    </section>
    </main>
</body>
</html>
